
[project]
name = "download_swot"
version = "0.1.0"
authors = [
	{name = "iury simoes-sousa", email = "iuryt@pm.me"}
]
license = "MIT"
description = "Download SWOT data from FTP."
requires-python = ">=3.11"
dependencies = [
	"xarray>=2025.9.0,<2026",
	"tqdm>=4.67.1,<5",
	"ipykernel>=6.30.1,<7",
	"netcdf4>=1.7.2,<2",
	"h5netcdf>=1.6.4,<2"
]

[project.optional-dependencies]
test = [
	"pytest>=7.0",
	"pytest-cov>=3.0"
]


[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]


[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]


[tool.pixi.pypi-dependencies]
download_swot = { path = ".", editable = true }


[tool.pixi.tasks]
download_swot = "python download_swot/download_swot.py"
test = "pytest --cov=download_swot tests"


[tool.pixi.dependencies]
xarray = ">=2025.9.0,<2026"
tqdm = ">=4.67.1,<5"
ipykernel = ">=6.30.1,<7"
netcdf4 = ">=1.7.2,<2"
h5netcdf = ">=1.6.4,<2"

[tool.pixi.feature.test.dependencies]
pytest = ">=7.0"
pytest-cov = ">=3.0"

[tool.pixi.environments]
default = { features = [] }
test = { features = ["test"] }
