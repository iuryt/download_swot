[project]
authors = [{name = "iury simoes-sousa", email = "iuryt@pm.me"}]
dependencies = []
name = "download_swot"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
download_swot = { path = ".", editable = true }

[tool.pixi.tasks]
download_swot = "python src/download_swot/download_swot.py"

[tool.pixi.dependencies]
xarray = ">=2025.8.0,<2026"
tqdm = ">=4.67.1,<5"
ipykernel = ">=6.30.1,<7"
